name: Despliegue manual a EC2

# No se despliega con cada push hasta validar migraciones y pruebas con PostgreSQL.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Credenciales temporales existentes. Migrar a GitHub OIDC antes de
      # automatizar; el proveedor OIDC aún no existe en esta cuenta AWS.
      - name: Autenticarse en AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Verificar cuenta y ejecutar despliegue por SSM
        env:
          INSTANCE_ID: i-092c3e48e393d4b3c
          EXPECTED_ACCOUNT: '201930053567'
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          test "$ACCOUNT" = "$EXPECTED_ACCOUNT"

          DEPLOY_COMMAND="set -eu
          git -C /opt/hackaton fetch origin main
          test \"\$(git -C /opt/hackaton rev-parse origin/main)\" = \"$GITHUB_SHA\"
          if [ -d /opt/hackaton-main ]; then
            test -z \"\$(git -C /opt/hackaton-main status --porcelain --untracked-files=no)\"
            git -C /opt/hackaton-main switch --detach origin/main
          else
            git -C /opt/hackaton worktree add --detach /opt/hackaton-main origin/main
          fi
          bash /opt/hackaton-main/scripts/deploy.sh"

          PARAMS=$(jq -n --arg command "$DEPLOY_COMMAND" '{commands: [$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Manual Club Enlace deploy $GITHUB_SHA" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          STATUS=Pending
          for attempt in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 5
          done
          echo "SSM status: $STATUS"
          test "$STATUS" = Success
