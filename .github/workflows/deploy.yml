name: Despliegue Continuo a EC2 (Club Enlace)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    name: Desplegar en EC2 via AWS SSM
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Ejecutar despliegue en EC2 via SSM
        id: ssm_deploy
        run: |
          INSTANCE_ID="i-092c3e48e393d4b3c"
          echo "Enviando comando de despliegue a $INSTANCE_ID..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "CI/CD Auto-deploy rama dev" \
            --parameters 'commands=[
              "cd /opt/hackaton",
              "git fetch origin dev",
              "git reset --hard origin/dev",
              "docker compose -f docker-compose.prod.yml up -d --build",
              "docker ps"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          echo "Esperando que finalice el despliegue..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Estado final del despliegue: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "El despliegue falló. Detalles:"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi

          echo "¡Despliegue completado exitosamente!"
