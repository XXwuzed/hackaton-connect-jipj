# Configuración de Nginx para Club Enlace (Farmaenlace)
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Compresión gzip para alto rendimiento
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream al contenedor del backend API
    upstream backend_api {
        server backend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Cabeceras de seguridad HTTP estándar
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. Rutas de la API Backend
        location /api/ {
            proxy_pass http://backend_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 2. Panel interno de administración y asesores (/admin)
        location ^~ /admin {
            alias /usr/share/nginx/html/admin;
            try_files $uri $uri/ /admin/index.html;

            location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # 3. Formulario público móvil para clientes (/)
        location / {
            root /usr/share/nginx/html/form;
            index index.html;
            try_files $uri $uri/ /index.html;

            location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
